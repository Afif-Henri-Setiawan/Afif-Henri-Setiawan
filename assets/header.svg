<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
    <stop stop-color="#07111F"/>
    <stop offset="0.5" stop-color="#0B2340"/>
    <stop offset="1" stop-color="#07566A"/>
  </linearGradient>

  <linearGradient id="glass" x1="130" y1="65" x2="760" y2="270" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF" stop-opacity="0.17"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
  </linearGradient>

  <linearGradient id="line" x1="155" y1="85" x2="290" y2="85" gradientUnits="userSpaceOnUse">
    <stop stop-color="#7DD3FC"/>
    <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
  </linearGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="35"/>
  </filter>

  <filter id="glow">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>

<!-- Background -->

<rect width="1200" height="330" rx="32" fill="url(#bg)"/>

<!-- Ambient glow -->

<circle cx="980" cy="95" r="155" fill="#22D3EE" fill-opacity="0.12" filter="url(#blur)"/>
<circle cx="850" cy="300" r="190" fill="#0EA5E9" fill-opacity="0.10" filter="url(#blur)"/>
<circle cx="235" cy="70" r="115" fill="#38BDF8" fill-opacity="0.07" filter="url(#blur)"/>

<!-- Decorative circles -->

<circle cx="920" cy="90" r="125" fill="#38BDF8" fill-opacity="0.08"/>
<circle cx="920" cy="90" r="125" stroke="#7DD3FC" stroke-opacity="0.08"/>

<circle cx="875" cy="260" r="170" fill="#06B6D4" fill-opacity="0.06"/>
<circle cx="875" cy="260" r="170" stroke="#67E8F9" stroke-opacity="0.05"/>

<!-- Abstract lines -->

<path d="M800 72C900 80 980 115 1030 185" stroke="#7DD3FC" stroke-opacity="0.16" stroke-width="2"/>
<path d="M790 95C900 110 960 145 1005 205" stroke="#7DD3FC" stroke-opacity="0.09" stroke-width="2"/>
<path d="M775 118C875 130 940 160 980 215" stroke="#7DD3FC" stroke-opacity="0.06" stroke-width="2"/>

<!-- Glass card -->

<rect x="62" y="58" width="670" height="215" rx="25"
   fill="url(#glass)"
   stroke="#FFFFFF"
   stroke-opacity="0.18"/>

<!-- Top accent -->

<rect x="86" y="82" width="145" height="5" rx="2.5" fill="url(#line)" filter="url(#glow)"/>

<!-- Name -->

<text x="88" y="143"
   fill="white"
   font-family="Inter, Arial, sans-serif"
   font-size="39"
   font-weight="700">
Afif Henri Setiawan </text>

<!-- Role -->

<text x="88" y="180"
   fill="#C7DDED"
   font-family="Inter, Arial, sans-serif"
   font-size="18">
Informatics Student · Web Developer · Mobile Developer </text>

<!-- Pills -->

<rect x="88" y="207" width="120" height="40" rx="20"
   fill="#FFFFFF" fill-opacity="0.09"
   stroke="#FFFFFF" stroke-opacity="0.12"/>

<text x="113" y="233"
   fill="#E2E8F0"
   font-family="Arial, sans-serif"
   font-size="14"
   font-weight="600">
React </text>

<rect x="220" y="207" width="120" height="40" rx="20"
   fill="#FFFFFF" fill-opacity="0.09"
   stroke="#FFFFFF" stroke-opacity="0.12"/>

<text x="245" y="233"
   fill="#E2E8F0"
   font-family="Arial, sans-serif"
   font-size="14"
   font-weight="600">
Next.js </text>

<rect x="352" y="207" width="120" height="40" rx="20"
   fill="#FFFFFF" fill-opacity="0.09"
   stroke="#FFFFFF"
   stroke-opacity="0.12"/>

<text x="377" y="233"
   fill="#E2E8F0"
   font-family="Arial, sans-serif"
   font-size="14"
   font-weight="600">
NestJS </text>

<rect x="484" y="207" width="120" height="40" rx="20"
   fill="#FFFFFF" fill-opacity="0.09"
   stroke="#FFFFFF"
   stroke-opacity="0.12"/>

<text x="509" y="233"
   fill="#E2E8F0"
   font-family="Arial, sans-serif"
   font-size="14"
   font-weight="600">
Flutter </text>

<!-- Right-side abstract UI -->

<rect x="830" y="112" width="140" height="78" rx="18"
   fill="#FFFFFF" fill-opacity="0.07"
   stroke="#FFFFFF" stroke-opacity="0.10"/>

<rect x="858" y="138" width="84" height="8" rx="4"
   fill="#7DD3FC" fill-opacity="0.25"/>

<rect x="858" y="158" width="55" height="7" rx="3.5"
   fill="#FFFFFF" fill-opacity="0.14"/>

<rect x="858" y="205" width="105" height="45" rx="15"
   fill="#FFFFFF" fill-opacity="0.05"
   stroke="#FFFFFF" stroke-opacity="0.08"/>

<circle cx="882" cy="228" r="8" fill="#38BDF8" fill-opacity="0.35"/>
<rect x="900" y="221" width="48" height="6" rx="3"
      fill="#FFFFFF" fill-opacity="0.12"/>

</svg>
