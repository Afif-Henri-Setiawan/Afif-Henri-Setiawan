<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
    <stop stop-color="#07111F"/>
    <stop offset="0.5" stop-color="#0B243D"/>
    <stop offset="1" stop-color="#075A6B"/>
  </linearGradient>

  <linearGradient id="glass" x1="80" y1="60" x2="780" y2="270" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.045"/>
  </linearGradient>

  <linearGradient id="accent" x1="90" y1="0" x2="280" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#7DD3FC"/>
    <stop offset="0.55" stop-color="#38BDF8"/>
    <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
  </linearGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="35"/>
  </filter>

  <filter id="glow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>


<!-- BACKGROUND -->

<rect
  width="1200"
  height="330"
  rx="30"
  fill="url(#bg)"
/>


<!-- BACKGROUND GLOW -->

<circle
  cx="970"
  cy="75"
  r="150"
  fill="#22D3EE"
  fill-opacity="0.13"
  filter="url(#blur)"
/>

